name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck against the error baseline
        run: pnpm typecheck:ratchet

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholders only: this job proves the app compiles, not that it runs.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/affilova
          NEXT_PUBLIC_APP_URL: https://affilova.example.com
