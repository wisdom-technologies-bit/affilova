# clamd configuration for the Affilova scanner service.
#
# Kept deliberately strict: archives are expanded, PDFs and OLE2 containers are
# scanned, and every case where ClamAV cannot look inside (encrypted content,
# exceeded limits) raises an alert. The service maps those alerts to a rejection
# rather than to an infection, so an unreadable file is never reported as clean.

DatabaseDirectory /data/clamav

# A single upload is capped at 2 GiB by MAX_FILE_BYTES, so these bounds are what
# clamd needs to read one file and the archives inside it.
MaxFileSize 2G
MaxScanSize 4G
MaxRecursion 6
MaxFiles 10000
MaxScanTime 300000

# Never let an unreadable container pass silently.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes
AlertBrokenExecutables yes

# Broad detection, including potentially unwanted applications.
DetectPUA yes

ScanPDF yes
ScanOLE2 yes
ScanArchive yes
ScanHTML yes
ScanMail no

LocalSocket /run/clamav/clamd.sock

User clamav

# Container friendly: run in the foreground so the entrypoint supervises clamd.
# With no LogFile set, clamd writes its log to stderr in the foreground, which the
# platform captures. Do not set LogFile to /dev/stdout: clamd locks its log file
# and that fails on the symlink chain in some containers.
Foreground yes
LogTime yes
