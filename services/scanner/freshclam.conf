# freshclam configuration for the Affilova scanner service.
#
# The signature database lives on the persistent disk so a redeploy does not have
# to re-download it, and it is refreshed every hour from the official mirrors.

DatabaseDirectory /data/clamav

# 24 checks per day, which is one per hour.
Checks 24

# Official ClamAV mirrors only.
DatabaseMirror database.clamav.net
DatabaseMirror db.local.clamav.net

UpdateLogFile /dev/stdout

# Keep the log in the foreground stream so the platform captures it.
LogTime yes
